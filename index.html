<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Chetter has moved</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #09090b;
        color: #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 35%, rgb(124 58 237 / 18%), transparent 58%), #09090b;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(32px, 8vw, 64px);
        border: 1px solid #27272a;
        border-radius: 24px;
        background: rgb(24 24 27 / 88%);
        text-align: center;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }

      .brand {
        display: inline-grid;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        place-items: center;
        border-radius: 18px;
        background: #7c3aed;
        font-size: 30px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 40px);
        letter-spacing: -0.04em;
      }

      p {
        margin: 16px 0 28px;
        color: #a1a1aa;
        font-size: 16px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 12px;
        background: #7c3aed;
        color: white;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 150ms ease;
      }

      a:hover {
        background: #6d28d9;
      }

      a:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">C</div>
      <h1>Chetter has permanently moved</h1>
      <p>We’ve moved to a new domain. Use the link below to continue to Chetter.</p>
      <a href="https://chetter.chetter-official.workers.dev">Click here to go to Chetter</a>
    </main>
  </body>
</html>
